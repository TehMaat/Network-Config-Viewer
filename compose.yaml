# Network Config Viewer on this computer.
#   Start:   docker compose up -d        then open http://localhost:8080
#   Update:  git pull, then docker compose up -d --build   (the archive is kept)
#   Stop:    docker compose down
# Never "docker compose down -v": -v deletes the volume with the archive of the clients.
services:
  app:
    build: .
    image: network-config-viewer:local
    ports:
      # Reachable only from this computer. Another port: NCV_PORT=9090 docker compose up -d
      - '127.0.0.1:${NCV_PORT:-8080}:8080'
    volumes:
      # The archive of the clients: original files and indexes, kept across updates.
      - ncv-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ncv-data:
