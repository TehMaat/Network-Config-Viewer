# Automated checks on every pull request and on main, and the release of every version
# merged on main (#13): a tag and a release with the notes of CHANGELOG.md, nothing else.
# Only code and synthetic sample configurations are used; no package, image or page is published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the run in progress; on main every run goes to the
  # end, so that every merged version is released.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, tipi, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker-e2e:
    name: Immagine Docker e test nel browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and start the container, as on the user's PC
        run: docker compose up -d --build --wait
      - name: Check the port, open only on localhost, and the protections of the server
        run: |
          docker compose port app 8080 | grep -q '^127.0.0.1:'
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          # Another name for this computer (DNS rebinding): refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8080/api/clients)" = 403
          # A change without the header of the app: refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"name":"x"}' http://127.0.0.1:8080/api/clients)" = 403
          # No root, and a read-only filesystem except the volume of the data.
          docker compose exec -T app sh -c 'test "$(id -u)" != 0 && ! touch /app/x 2>/dev/null && touch /data/.w && rm /data/.w'
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests against the container, on Chromium, Firefox and WebKit
        run: npm run test:e2e
        env:
          NCV_BASE_URL: http://127.0.0.1:8080
          NCV_ALL_BROWSERS: '1'
      - name: The archive survives a restart and an update of the container
        run: |
          (cd packages/web && NCV_PERSISTENCE=prepare npx playwright test persistence --project=chromium)
          docker compose down
          docker compose up -d --build --wait
          (cd packages/web && NCV_PERSISTENCE=verify npx playwright test persistence --project=chromium)
        env:
          NCV_BASE_URL: http://127.0.0.1:8080
      - name: Container logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down

  release:
    name: Rilascio della versione
    # Only for what is merged on main, and only when every check has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, docker-e2e]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes: the tag and the release of the version.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Tag and release the version of package.json, once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to do."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" \
            --notes-file "$RUNNER_TEMP/notes.md"
